# Unity Bridge 批量任务配置 - 日常-尽快完成
# 基于 interface.json 的 "日常-尽快完成" preset
# 使用方法: .\.venv\Scripts\python.exe agent\run_batch_tasks.py --config config.daily-quick.toml

[bridge]
# unity-automation-bridge 插件目录路径
# 留空则自动从游戏窗口发现
dir = ""

# 全局配置
[global]
account_id = "0"
default_timeout = 1200.0
# 任务失败时是否继续执行后续任务
continue_on_error = true

# 批量任务列表（按顺序执行）
[[tasks]]
name = "[全局]启动脚本(置顶)PC"
enabled = false

[[tasks]]
name = "[执行]快速狩猎扫荡"
enabled = true
options = [
    {name = "冒险航线", value = "Yes"},
    {name = "双倍策略", value = "优先双倍"},
    {name = "资源策略", value = "优先金币"},
    {name = "米饭分配次数", value = "狩猎场x1 / 双倍图MAX"},
    {name = "狩猎场", value = "Yes"},
    {name = "章节图策略", value = "矿石·章节7"},
    {name = "圣石洞穴属性", value = "光"}
]

[[tasks]]
name = "[执行]装备制作&炼制日常"
enabled = false
options = [
    {name = "精炼装备阶级", value = "UR"},
    {name = "仅精炼<17 或 <10", value = "低于17阶"},
    {name = "精炼按自定义标志排序", value = "Yes"},
    {name = "精炼类别倾向应用-按需|强制", value = "No"},
    {name = "精炼类别倾向-专武|制作", value = "No"}
]

[[tasks]]
name = "[执行]白嫖抽卡"
enabled = true
options = [
    {name = "一键速抽", value = "Yes"},
    {name = "5星必出保留", value = "No"},
    {name = "付费钻-总开关", value = "No"},
    # {name = "90付费抽目标卡池", value = "xxx"}
]

[[tasks]]
name = "[执行]地图采集[单章]"
enabled = false
options = [
    {name = "采集卡带屏蔽", value = "No"},
    # 以下屏蔽名单默认留空；需要启用时请填写名称后取消注释
    # {name = "故事卡带屏蔽", value = ""},
    # {name = "角色卡带屏蔽", value = ""},
    # {name = "活动卡带屏蔽", value = ""},
    {name = "第三图采集额外等待", value = "200"}
]

[[tasks]]
name = "[执行]竞技场"
enabled = true
options = [
    {name = "竞技场战斗倍数", value = "40倍"}
]

[[tasks]]
name = "[执行]赛季活动快速战斗"
enabled = true
options = [
    {name = "赛季活动快速战斗难度", value = "自动"},
    {name = "魔兽初始等级", value = "1"}
]

[[tasks]]
name = "[执行]周常任务"
enabled = true
options = [
    {name = "末日之书", value = "Yes"},
    {name = "小屋点赞", value = "Yes"},
    {name = "周常钓鱼", value = "No"}
]

[[tasks]]
name = "[领取]日常任务"
enabled = true
options = [
    {name = "餐馆领装饰币", value = "Yes"},
    {name = "餐馆自动升级", value = "No"},
    {name = "广场每日祈求", value = "Yes"},
    {name = "亲密度谈心", value = "No"},
    {name = "亲密度谈心等级筛选", value = "Lv<10"}
]

[[tasks]]
name = "[领取]任务页(每日/每周)"
enabled = true

[[tasks]]
name = "[领取]活动页奖励"
enabled = true
options = [
    {name = "进入前先领取邮件", value = "Yes"}
]

[[tasks]]
name = "[领取]通行证奖励"
enabled = true

[[tasks]]
name = "[领取]领取邮件"
enabled = true

[[tasks]]
name = "[执行]商店套利"
enabled = false
options = [
    {name = "利润商品-低价进货", value = "Yes"},
    # 收藏扫描频率采用上游的每次/每周/从不选项；无 Bridge 收藏执行模式
    {name = "购买收藏扫描频率", value = "每周"},
    {name = "利润商品-最高价抛售", value = "No"},
    {name = "利润料理-制作", value = "No"}
]

[[tasks]]
name = "[执行]地图采集[完整]"
enabled = false
options = [
    {name = "简单类跳过", value = "Yes"},
    {name = "采集卡带屏蔽", value = "No"},
    # 以下屏蔽名单默认留空；需要启用时请填写名称后取消注释
    # {name = "故事卡带屏蔽", value = ""},
    # {name = "角色卡带屏蔽", value = ""},
    # {name = "活动卡带屏蔽", value = ""},
    {name = "第三图采集额外等待", value = "200"}
]

[[tasks]]
name = "[全局]结束游戏"
enabled = false
